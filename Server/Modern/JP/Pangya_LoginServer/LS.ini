IP              =   127.0.0.1


MAXUSER         =   2001

PROPERTY        =   2048

[OPTION]

; 1 ON, 0 OFF
SAME_ID_LOGIN	=	0

; 1 ON, 0 OFF
CREATEUSER		=	0

; 1 SO GM e IP registrados, 0 TODOS
ACCESSFLAG		=	0

; 1 SERVER MANUTENTION, 0 SERVER ONLINE
MANUTENTION = 0

;TTL = Time To Live, tempo em millisegundos para derrubar o player se ele n�o madar a resposta nesse tempo
; ou 0 para desativar
TTL = 60000

ANTIBOTTTL = 10000
 
[TIMEOUT] 
#HANDSHAKE: segundos que o cliente tem para enviar CS 0x01
#após conectar. Se não enviar nada nesse tempo → kick.
#Muito baixo = kick jogadores com conexão lenta.
#Muito alto = bots/scanners ficam conectados ocupando slot. 
HANDSHAKE       = 20

#IDLE: segundos sem receber NENHUM pacote após o login.
#O TTL periódico do cliente (CS 0x01 a cada ~30s) reseta esse timer.
#Se o jogador crashar sem fechar o socket, esse timeout limpa a sessão. 
IDLE            = 180

#SEND: timeout em milissegundos para o socket entregar dados ao cliente.
#Se o cliente parar de receber (travou, perdeu conexão sem DC) e o buffer
#do kernel encher, o Send vai travar. Esse timeout aborta após X ms. 
SEND            = 10000

#CHECK_INTERVAL: segundos entre cada varredura de timeout.
#Valores menores = detecção mais rápida, mais CPU.
#Valores maiores = menos CPU, sessões fantasma ficam mais tempo. 
CHECK_INTERVAL  = 10

